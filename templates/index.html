<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /*FONTS*/
      /*/FONTS*/
      /* Облик проекта — заполняется из STYLE.md. Слой канала (субтитры, кикеры, зоны) не трогаем. */
      :root {
        --ground: #0b0c10;
        --panel: #15171d;
        --panel-2: #1c1f27;
        --line: rgba(245, 243, 238, 0.1);
        --ink: #f5f3ee;
        --muted: #8b909a;
        --accent: #ff5a36;
        --on-accent: #ffffff;
        --font-display: "Montserrat RU";
        --font-body: "Inter RU";
        --font-mono: "JetBrains Mono RU";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; font-family: var(--font-body); color: var(--ink); }
      #bg { position: absolute; inset: 0; background: var(--ground); overflow: hidden; }
      /* Слой канала: кикер — моно, капс, акцент, со звёздочкой. Используйте класс .kicker в сценах. */
      .kicker {
        font-family: var(--font-mono); font-weight: 700; font-size: 30px;
        letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__"
      data-width="1080" data-height="1920">
      <div id="bg" data-layout-ignore></div>

      <!--SCENES-->

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="__DURATION__" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 20"></div>

      <audio id="voice" class="clip" src="assets/voice.wav" data-start="0" data-track-index="3" data-volume="1"></audio>

      <!--SFX-->

      <!-- Звуки на действия (pop, click-soft, sparkle, typing) — ниже; scenes.py их не трогает. -->
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
